<!doctype html>
<html lang="ru">
  <head>
    <!-- required: html-entry injects relative urls (like main.js) that must be resolved from root on nested pages -->
    <!-- for build these urls are replaced by inline content (see webpack.inlineAssets.js) -->
    <base href="/" />
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Раскрытие скобок</title>

    <!-- generated by WebpackObsoletePlugin (see webpack.common.js); relative url is skipped by webpack because placed after <base> -->
    <script defer src="obsolete.js"></script>
  </head>

  <body>
    <noscript>
      <strong> We're sorry but this doesn't work properly without JavaScript enabled. Please enable it to continue. </strong>
    </noscript>
    <div id="app"></div>
    <!-- entryPoint: webpack compiles it and injects split chunks next to it; path is from project root because relative urls after <base> are skipped -->
    <!-- WARN: it's placed at the end of body because 'defer' doesn't work for inline scripts (see webpack.inlineAssets.js) -->
    <script defer src="/src/main.tsx"></script>
  </body>
</html>
